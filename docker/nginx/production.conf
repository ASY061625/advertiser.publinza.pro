# ---------------------------------------------------------------------------
# Production server blocks for publinza.pro.
#
# Deploy this file to /etc/nginx/conf.d/publinza.conf on the web tier. It is
# deliberately NOT in docker/nginx/conf.d so that local development does not
# try to load certificates that do not exist there.
#
# Certificates are issued per hostname; the ACME challenge path stays on HTTP.
# ---------------------------------------------------------------------------

# Brute-force protection for the unlisted admin path. The application applies
# throttle:10,1 to the same routes. Declared here rather than in the http block
# so this file is self-contained: conf.d files are included inside http{}, and
# only one of the two Publinza configs is ever loaded at a time.
limit_req_zone $binary_remote_addr zone=asylogin:10m rate=10r/m;

# --- HTTP: ACME challenge, everything else redirects to HTTPS ---------------
server {
    listen 80;
    listen [::]:80;
    server_name publinza.pro www.publinza.pro app.publinza.pro;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Canonical host: www -> apex --------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name www.publinza.pro;

    ssl_certificate     /etc/letsencrypt/live/publinza.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/publinza.pro/privkey.pem;

    return 301 https://publinza.pro$request_uri;
}

# --- 1. Marketing site + 3. admin panel at /asylogin ------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name publinza.pro;

    root /var/www/publinza/current/public;
    index index.php;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/publinza.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/publinza.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS on the apex covers app.publinza.pro too via includeSubDomains.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- Admin entry point -------------------------------------------------
    # /asylogin resolves to the same PHP front controller; the route group in
    # bootstrap/app.php binds it to the admin guard and the admin Inertia root
    # template, which is what keeps the admin bundle off the other surfaces.
    location ^~ /asylogin {
        limit_req zone=asylogin burst=5 nodelay;

        # `always` so the headers survive error responses too. Repeating the
        # HSTS header here is required: an add_header in a location block
        # replaces the whole inherited set rather than adding to it.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        add_header Pragma "no-cache" always;

        # Never let an admin page end up in a shared cache or a search index.
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# --- 2. Advertiser app ------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.publinza.pro;

    root /var/www/publinza/current/public;
    index index.php;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/app.publinza.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.publinza.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # The admin panel is not reachable from the app subdomain, even though the
    # two surfaces share a document root.
    location ^~ /asylogin {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
