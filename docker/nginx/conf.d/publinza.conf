# ---------------------------------------------------------------------------
# Local development. Plain HTTP, both surfaces on one nginx.
#
# Add to /etc/hosts on the host machine:
#   127.0.0.1  publinza.localhost app.publinza.localhost
#
# The production configuration (TLS, HSTS, redirects) lives in
# docker/nginx/production.conf and is not loaded here.
# ---------------------------------------------------------------------------

# Brute-force protection for the unlisted admin path. The application applies
# throttle:10,1 to the same routes. Declared here rather than in the http block
# so this file is self-contained: conf.d files are included inside http{}, and
# only one of the two Publinza configs is ever loaded at a time.
limit_req_zone $binary_remote_addr zone=asylogin:10m rate=10r/m;

# 1. Apex — marketing site, and the admin panel under /asylogin.
server {
    listen 80;
    server_name publinza.localhost;
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Admin entry point. Same PHP front controller, but the path is rate
    # limited and framed by its own security headers.
    location ^~ /asylogin {
        limit_req zone=asylogin burst=5 nodelay;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;

        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# 2. Advertiser app.
server {
    listen 80;
    server_name app.publinza.localhost;
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # The advertiser surface has no admin entry point at all.
    location ^~ /asylogin {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
