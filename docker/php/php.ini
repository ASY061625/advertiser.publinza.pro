memory_limit = 512M
upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 60

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
; Local development: pick up file changes without a restart. Set to 0 and
; enable opcache.validate_timestamps=0 in production images.
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1

expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
