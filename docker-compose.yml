services:
    php:
        build:
            context: ./docker/php
            args:
                UID: ${UID:-1000}
                GID: ${GID:-1000}
        volumes:
            - .:/var/www/html:cached
        environment:
            PHP_IDE_CONFIG: serverName=publinza
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks: [publinza]

    nginx:
        image: nginx:1.27-alpine
        ports:
            - '${NGINX_PORT:-80}:80'
        volumes:
            - .:/var/www/html:cached
            - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
        depends_on: [php]
        networks:
            publinza:
                aliases:
                    # Both surfaces resolve inside the network; add matching
                    # entries to /etc/hosts on the host machine.
                    - publinza.localhost
                    - app.publinza.localhost

    horizon:
        build:
            context: ./docker/php
            args:
                UID: ${UID:-1000}
                GID: ${GID:-1000}
        command: php artisan horizon
        volumes:
            - .:/var/www/html:cached
        depends_on:
            redis:
                condition: service_healthy
            mysql:
                condition: service_healthy
        restart: unless-stopped
        networks: [publinza]

    mysql:
        image: mysql:8.0
        command: --default-authentication-plugin=caching_sha2_password
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-publinza}
            MYSQL_USER: ${DB_USERNAME:-publinza}
            MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        volumes:
            - mysql:/var/lib/mysql
            - ./docker/mysql/my.cnf:/etc/mysql/conf.d/publinza.cnf:ro
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-p${DB_PASSWORD:-secret}']
            interval: 5s
            timeout: 5s
            retries: 20
        networks: [publinza]

    redis:
        image: redis:7-alpine
        command: redis-server --appendonly yes
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - redis:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 20
        networks: [publinza]

    meilisearch:
        image: getmeili/meilisearch:v1.8
        environment:
            MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-masterKeyForLocalDevelopmentOnly}
            MEILI_NO_ANALYTICS: 'true'
            MEILI_ENV: development
        ports:
            - '${FORWARD_MEILISEARCH_PORT:-7700}:7700'
        volumes:
            - meilisearch:/meili_data
        healthcheck:
            test: ['CMD', 'wget', '--no-verbose', '--spider', 'http://localhost:7700/health']
            interval: 5s
            timeout: 5s
            retries: 20
        networks: [publinza]

    mailpit:
        image: axllent/mailpit:latest
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks: [publinza]

    # Opt-in: `docker compose --profile vite up -d`. `make dev` runs Vite on the
    # host instead, so this service is off by default to keep 5173 free.
    vite:
        profiles: [vite]
        image: node:22-alpine
        working_dir: /var/www/html
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
        ports:
            - '${VITE_PORT:-5173}:5173'
        volumes:
            - .:/var/www/html:cached
        networks: [publinza]

volumes:
    mysql:
    redis:
    meilisearch:

networks:
    publinza:
        driver: bridge
